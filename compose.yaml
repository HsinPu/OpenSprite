services:
  opensprite:
    build:
      context: .
    image: opensprite:local
    environment:
      OPENSPRITE_DEPLOYMENT_BASE_IMAGE: "${OPENSPRITE_DEPLOYMENT_BASE_IMAGE:-opensprite:local}"
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENSPRITE_PORT:-8765}:8765"
    volumes:
      - opensprite-data:/home/opensprite/.opensprite
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  opensprite-data:
