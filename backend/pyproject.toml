[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "opensprite-backend"
version = "0.3.0"
description = "Local HTTP service foundation for OpenSprite"
requires-python = ">=3.12,<3.14"
dependencies = [
  "cryptography==50.0.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "mcp>=2,<3",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opensprite_backend"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
